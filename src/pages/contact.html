{{> header}}
<main id="main">
<section class="page-hero" aria-labelledby="page-h">

  <div class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">Contact Us</span></nav>
    <h1 id="page-h">Contact us to book your rental car</h1>
    <p class="lead">The fastest way to book is a call or a WhatsApp message. You can also send the form below and we'll get straight back to you.</p>
    <div class="quick-contacts">
      <a class="qc" href="tel:{{site.phoneTel}}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><span><small>Call 24/7</small>{{site.phoneDisplay}}</span></a>

      <a class="qc" href="mailto:{{site.email}}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg><span><small>Email</small>{{site.email}}</span></a>
    </div>
  </div>
</section>
{{> contact-section}}
</main>
